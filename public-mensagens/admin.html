<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Enviar Aviso</title>
<meta name="theme-color" content="#121316">
<style>
  :root {
    --bg-app: #121316;
    --bg-header: #1a1b1f;
    --bg-surface: #1e2025;
    --bg-card: #18191d;
    --border: #2d3139;
    --accent: #f59e0b;
    --text-main: #f3f4f6;
    --text-dim: #9ca3af;
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-app); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; background: var(--bg-header); border-bottom: 1px solid var(--border);
  }
  .header-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .btn { background: #3a3d44; color: var(--text-main); border: none; border-radius: 8px; padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #464a52; }
  .btn.accent { background: var(--accent); color: #000; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn.small { padding: 7px 12px; font-size: 12.5px; }
  .conteudo { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .lista-usuarios { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .card-usuario {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  }
  .card-usuario-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-usuario-nome { font-size: 15.5px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: #2a2e35; border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--text-dim); }
  .card-usuario-acoes { display: flex; gap: 8px; }
  .form-editar { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
  .form-editar.aberto { display: block; }
  .campo { margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); letter-spacing: .3px; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; background: #282828; border: 1px solid #3e3e3e; border-radius: 8px; color: #fff;
    font-size: 14.5px; padding: 10px 12px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .checkboxes { display: flex; flex-wrap: wrap; gap: 10px; }
  .checkbox-item { display: flex; align-items: center; gap: 6px; background: #22252b; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; cursor: pointer; }
  .checkbox-item input { width: auto; }
  .linha-senha-gerada { display: flex; gap: 8px; }
  .linha-senha-gerada input { flex: 1; }
  .acoes-form { display: flex; gap: 10px; margin-top: 14px; }
  .msg-status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg-status.erro { color: var(--danger); }
  .msg-status.ok { color: var(--success); }
  .painel-novo { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; }
  .painel-novo h2 { font-size: 15px; margin-bottom: 14px; }
  .vazio { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
  <div class="header-bar">
    <div class="header-title">🛠️ Painel Admin</div>
    <div style="display:flex;gap:8px">
      <button class="btn small" id="btn-trocar-senha">Trocar minha senha</button>
      <button class="btn small" id="btn-sair">Sair</button>
    </div>
  </div>

  <div class="conteudo">
    <div class="painel-novo" id="painel-trocar-senha" style="display:none;margin-bottom:20px">
      <h2>Trocar minha senha de admin</h2>
      <div class="campo">
        <label for="senha-atual">Senha atual</label>
        <input type="password" id="senha-atual" autocomplete="current-password">
      </div>
      <div class="campo">
        <label for="senha-nova">Nova senha (mín. 8 caracteres)</label>
        <div class="linha-senha-gerada">
          <input type="text" id="senha-nova" placeholder="Digite ou gere uma senha">
          <button class="btn small" id="btn-gerar-senha-admin" type="button">Gerar</button>
        </div>
      </div>
      <div class="acoes-form">
        <button class="btn accent" id="btn-salvar-senha-admin">Salvar nova senha</button>
        <button class="btn small" id="btn-cancelar-senha-admin">Cancelar</button>
      </div>
      <div class="msg-status" id="status-senha-admin"></div>
    </div>

    <div class="lista-usuarios" id="lista-usuarios">
      <div class="vazio">Carregando usuários...</div>
    </div>

    <div class="painel-novo">
      <h2>+ Novo usuário</h2>
      <div class="campo">
        <label for="novo-usuario">Usuário (login)</label>
        <input type="text" id="novo-usuario" placeholder="ex.: estacionamento" autocapitalize="off" autocomplete="off">
      </div>
      <div class="campo">
        <label for="novo-senha">Senha (mín. 8 caracteres)</label>
        <div class="linha-senha-gerada">
          <input type="text" id="novo-senha" placeholder="Digite ou gere uma senha">
          <button class="btn small" id="btn-gerar-senha" type="button">Gerar</button>
        </div>
      </div>
      <div class="campo">
        <label>Modelos que esse usuário pode enviar</label>
        <div class="checkboxes" id="novo-modelos"></div>
      </div>
      <div class="acoes-form">
        <button class="btn accent" id="btn-criar">Criar usuário</button>
      </div>
      <div class="msg-status" id="status-novo"></div>
    </div>
  </div>

  <script>
    let modelosDisponiveis = [];
    let usuarios = [];

    function gerarSenhaForte() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let s = '';
      const arr = new Uint8Array(14);
      crypto.getRandomValues(arr);
      for (let i = 0; i < arr.length; i++) s += chars[arr[i] % chars.length];
      return s;
    }

    document.getElementById('btn-gerar-senha').addEventListener('click', () => {
      document.getElementById('novo-senha').value = gerarSenhaForte();
    });

    document.getElementById('btn-sair').addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    const painelTrocarSenha = document.getElementById('painel-trocar-senha');
    document.getElementById('btn-trocar-senha').addEventListener('click', () => {
      painelTrocarSenha.style.display = painelTrocarSenha.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('btn-cancelar-senha-admin').addEventListener('click', () => {
      painelTrocarSenha.style.display = 'none';
      document.getElementById('senha-atual').value = '';
      document.getElementById('senha-nova').value = '';
      document.getElementById('status-senha-admin').textContent = '';
    });
    document.getElementById('btn-gerar-senha-admin').addEventListener('click', () => {
      document.getElementById('senha-nova').value = gerarSenhaForte();
    });
    document.getElementById('btn-salvar-senha-admin').addEventListener('click', async () => {
      const statusEl = document.getElementById('status-senha-admin');
      const senhaAtual = document.getElementById('senha-atual').value;
      const novaSenha = document.getElementById('senha-nova').value;
      const res = await fetch('/admin/api/senha', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senhaAtual, novaSenha })
      });
      if (res.ok) {
        // Trocar a senha derruba a sessão de propósito — precisa entrar de novo com a nova.
        alert('Senha trocada! Você vai precisar entrar de novo.');
        window.location.href = '/admin/login';
      } else {
        const data = await res.json();
        statusEl.className = 'msg-status erro';
        statusEl.textContent = data.error || 'Erro ao trocar a senha.';
      }
    });

    function renderCheckboxes(container, selecionados) {
      container.innerHTML = modelosDisponiveis.map(m => `
        <label class="checkbox-item">
          <input type="checkbox" value="${m}" ${selecionados.includes(m) ? 'checked' : ''}>
          <span>${m}</span>
        </label>
      `).join('') || '<span style="color:var(--text-dim);font-size:13px">Nenhum modelo encontrado no ProPresenter.</span>';
    }

    function renderLista() {
      const container = document.getElementById('lista-usuarios');
      if (usuarios.length === 0) {
        container.innerHTML = '<div class="vazio">Nenhum usuário cadastrado ainda.</div>';
        return;
      }
      container.innerHTML = usuarios.map(u => `
        <div class="card-usuario" data-usuario="${u.usuario}">
          <div class="card-usuario-topo">
            <div class="card-usuario-nome">${u.usuario}</div>
          </div>
          <div class="chips">${u.modelos.map(m => `<span class="chip">${m}</span>`).join('')}</div>
          <div class="card-usuario-acoes">
            <button class="btn small btn-editar">Editar</button>
            <button class="btn small danger btn-remover">Remover</button>
          </div>
          <div class="form-editar">
            <div class="campo">
              <label>Modelos permitidos</label>
              <div class="checkboxes checkboxes-editar"></div>
            </div>
            <div class="campo">
              <label>Nova senha (deixe em branco pra manter a atual)</label>
              <div class="linha-senha-gerada">
                <input type="text" class="input-nova-senha" placeholder="Só preencha se quiser trocar">
                <button class="btn small btn-gerar-senha-editar" type="button">Gerar</button>
              </div>
            </div>
            <div class="acoes-form">
              <button class="btn accent btn-salvar-edicao">Salvar</button>
              <button class="btn small btn-cancelar-edicao">Cancelar</button>
            </div>
            <div class="msg-status"></div>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.card-usuario').forEach(card => {
        const usuario = card.dataset.usuario;
        const dados = usuarios.find(u => u.usuario === usuario);
        const formEditar = card.querySelector('.form-editar');
        const checkboxesEditar = card.querySelector('.checkboxes-editar');

        card.querySelector('.btn-editar').addEventListener('click', () => {
          renderCheckboxes(checkboxesEditar, dados.modelos);
          formEditar.classList.toggle('aberto');
        });
        card.querySelector('.btn-cancelar-edicao').addEventListener('click', () => {
          formEditar.classList.remove('aberto');
        });
        card.querySelector('.btn-gerar-senha-editar').addEventListener('click', () => {
          card.querySelector('.input-nova-senha').value = gerarSenhaForte();
        });
        card.querySelector('.btn-remover').addEventListener('click', async () => {
          if (!confirm(`Remover o usuário "${usuario}"? Ele perde acesso imediatamente.`)) return;
          const res = await fetch(`/admin/api/usuarios/${usuario}`, { method: 'DELETE' });
          if (res.ok) carregar();
        });
        card.querySelector('.btn-salvar-edicao').addEventListener('click', async () => {
          const statusEl = card.querySelector('.form-editar .msg-status');
          const modelosSelecionados = Array.from(checkboxesEditar.querySelectorAll('input:checked')).map(i => i.value);
          const novaSenha = card.querySelector('.input-nova-senha').value.trim();
          const corpo = { modelos: modelosSelecionados };
          if (novaSenha) corpo.senha = novaSenha;
          const res = await fetch(`/admin/api/usuarios/${usuario}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
          });
          const data = await res.json();
          if (res.ok) { statusEl.className = 'msg-status ok'; statusEl.textContent = 'Salvo!'; carregar(); }
          else { statusEl.className = 'msg-status erro'; statusEl.textContent = data.error || 'Erro ao salvar.'; }
        });
      });
    }

    document.getElementById('btn-criar').addEventListener('click', async () => {
      const statusEl = document.getElementById('status-novo');
      const usuario = document.getElementById('novo-usuario').value.trim().toLowerCase();
      const senha = document.getElementById('novo-senha').value;
      const modelos = Array.from(document.querySelectorAll('#novo-modelos input:checked')).map(i => i.value);

      const res = await fetch('/admin/api/usuarios', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha, modelos })
      });
      const data = await res.json();
      if (res.ok) {
        statusEl.className = 'msg-status ok';
        statusEl.textContent = `Usuário "${usuario}" criado!`;
        document.getElementById('novo-usuario').value = '';
        document.getElementById('novo-senha').value = '';
        carregar();
      } else {
        statusEl.className = 'msg-status erro';
        statusEl.textContent = data.error || 'Erro ao criar usuário.';
      }
    });

    async function carregar() {
      const res = await fetch('/admin/api/usuarios');
      if (res.status === 401) { window.location.href = '/admin/login'; return; }
      const data = await res.json();
      usuarios = data.usuarios || [];
      modelosDisponiveis = data.modelosDisponiveis || [];
      renderLista();
      renderCheckboxes(document.getElementById('novo-modelos'), []);
    }

    carregar();
  </script>
</body>
</html>
